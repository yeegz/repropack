# Builds release artifacts when a version tag is pushed. Artifacts are attached
# to the workflow run only; publishing a GitHub release is a manual step.
name: release-artifacts
on:
  push: { tags: ['v*'] }
permissions: { contents: read }
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.x' }
      - run: bash scripts/package-cli.sh "$GITHUB_REF_NAME" dist/cli
      - uses: actions/upload-artifact@v4
        with: { name: repropack-cli, path: dist/cli/, if-no-files-found: error }
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - run: go install github.com/google/go-licenses/v2@v2.0.1
      - run: wails build -platform darwin/universal -trimpath
        working-directory: desktop
      - run: bash scripts/package-desktop-macos.sh dist/desktop
      - uses: actions/upload-artifact@v4
        with: { name: repropack-desktop-macos, path: dist/desktop/, if-no-files-found: error }
